# Pages CMS editor for this site (https://pagescms.org)
# Each entry below becomes one item in the musician's menu.
# The layout file (content/layout.json) is deliberately NOT listed: only Two Fish changes the design.

media:
  - name: photos
    label: Photos
    input: media/photos
    output: /media/photos
    extensions: [jpg, jpeg, png, webp]
  - name: music
    label: Music previews
    input: media/music
    output: /media/music
    extensions: [mp3, m4a]
  - name: files
    label: Documents
    input: media/files
    output: /media/files
    extensions: [pdf]

content:
  - name: dates
    label: Upcoming dates
    type: file
    path: content/dates.json
    format: json
    list: true
    fields:
      - name: when
        label: Date and start time
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
        description: Past dates disappear from your site on their own. No need to delete them.
      - name: venue
        label: Venue or church name
        type: string
        required: true
      - name: city
        label: City
        type: string
      - name: state
        label: State
        type: string
        description: Two letters, like FL
      - name: type
        label: Kind of event
        type: select
        options:
          values:
            - name: venue
              label: Concert or venue
            - name: church
              label: Church service or event
      - name: tag
        label: Label on the date (optional)
        type: string
        description: A word or two shown on the date, for example Worship night, Concert or Youth night. Leave empty for the usual Church or Show.
      - name: details
        label: Short note (optional)
        type: string
        description: For example, Doors 6:30 PM or Christmas by Candlelight
      - name: link
        label: Tickets or event page link
        type: string
      - name: price
        label: Ticket price in dollars (0 if free)
        type: number

  - name: videos
    label: Videos
    type: file
    path: content/videos.json
    format: json
    list: true
    fields:
      - name: title
        label: Video title
        type: string
        required: true
      - name: youtube_link
        label: YouTube link
        type: string
        required: true
        description: Copy the address from YouTube and paste it here. The first video is the featured one.

  - name: interviews
    label: Podcasts and interviews
    type: file
    path: content/interviews.json
    format: json
    list: true
    fields:
      - name: title
        label: Episode or interview title
        type: string
        required: true
      - name: show
        label: Show or publication
        type: string
      - name: date
        label: Date it came out
        type: date
        options:
          format: yyyy-MM-dd
        description: The newest one is featured at the top.
      - name: minutes
        label: Length in minutes (optional)
        type: number
      - name: summary
        label: One or two sentences about it (optional)
        type: text
      - name: link
        label: Link to the episode
        type: string
      - name: youtube_link
        label: YouTube link (optional)
        type: string
        description: If the interview is on YouTube, visitors can play it right on your site.

  - name: profile
    label: Photos, headline and story
    type: file
    path: content/profile.json
    format: json
    fields:
      - name: name
        label: Artist or band name
        type: string
        required: true
      - name: headline
        label: Headline (what people search for)
        type: string
        required: true
        options:
          maxlength: 70
        description: This becomes your page title in Google. Keep it short, for example Christian singer-songwriter from Jacksonville, FL
      - name: intro
        label: One-sentence welcome
        type: text
      - name: hometown
        label: Home town
        type: string
      - name: main_photo
        label: Main photo (wide)
        type: image
        options:
          media: photos
      - name: portrait_photo
        label: Portrait photo (tall)
        type: image
        options:
          media: photos
      - name: about_photo
        label: Photo for your story
        type: image
        options:
          media: photos
      - name: story
        label: Your story
        type: text
        description: Leave a blank line between paragraphs.
      - name: quote
        label: A quote about your music (optional)
        type: string
      - name: quote_by
        label: Who said it
        type: string
      - name: verse
        label: Scripture verse (optional)
        type: text
      - name: verse_ref
        label: Verse reference
        type: string
        description: For example, Psalm 96:1 · KJV
      - name: timeline
        label: Milestones (only if your template shows a timeline)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} {text}"
        fields:
          - name: year
            label: Year
            type: string
            required: true
          - name: text
            label: What happened
            type: string
            required: true

  - name: album
    label: Album and songs
    type: file
    path: content/album.json
    format: json
    fields:
      - name: title
        label: Album title
        type: string
      - name: released
        label: Release date
        type: date
        options:
          format: yyyy-MM-dd
      - name: note
        label: A sentence about the album
        type: text
      - name: cover
        label: Album cover (square)
        type: image
        options:
          media: photos
      - name: bandcamp_link
        label: Bandcamp album link
        type: string
        description: Where people buy and download the album.
      - name: bandcamp_album_id
        label: Bandcamp album number (optional)
        type: string
        description: From Bandcamp's Share / Embed code. Lets visitors open the Bandcamp player on your site. Two Fish can fill this in for you.
      - name: songs
        label: Songs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Song title
            type: string
            required: true
          - name: length
            label: Length
            type: string
            description: For example, 3:42
          - name: scripture
            label: Scripture behind the song (optional)
            type: string
          - name: story
            label: Story behind the song (optional)
            type: text
          - name: audio
            label: Song preview file (MP3)
            type: file
            options:
              media: music
            description: Plays in the player on your site. Keep each file under 25 MB.
          - name: free_download
            label: Offer this song as a free download
            type: boolean
          - name: buy_link
            label: Bandcamp link to buy this song
            type: string
            description: Used when the song is not a free download.

  - name: merch
    label: Merch
    type: file
    path: content/merch.json
    format: json
    list: true
    fields:
      - name: name
        label: Product name
        type: string
        required: true
      - name: price
        label: Price
        type: string
        description: For example, $25
      - name: description
        label: Short description
        type: string
      - name: link
        label: Link to buy (Fourthwall, Bandcamp or your store)
        type: string
        required: true
      - name: photo
        label: Product photo (square)
        type: image
        options:
          media: photos

  - name: church-resources
    label: Chord charts for churches
    type: file
    path: content/church-resources.json
    format: json
    list: true
    fields:
      - name: song
        label: Song
        type: string
        required: true
      - name: key
        label: Key
        type: string
      - name: tempo
        label: Tempo (BPM)
        type: number
      - name: ccli
        label: CCLI song number
        type: string
      - name: chord_chart
        label: Chord chart (PDF)
        type: file
        options:
          media: files
      - name: lead_sheet
        label: Lead sheet (PDF)
        type: file
        options:
          media: files
      - name: chart_label
        label: Name for the chart button (optional)
        type: string
        description: Leave empty for "Chord chart". For example, Piano score or Lyrics and chords.
      - name: video_link
        label: Tutorial or motions video link (optional)
        type: string
      - name: video_label
        label: Name for the video button (optional)
        type: string
        description: Leave empty for "Tutorial video". For example, Motions video.

  - name: links
    label: Contact and links
    type: file
    path: content/links.json
    format: json
    fields:
      - name: booking_email
        label: Booking email
        type: string
      - name: email
        label: General email
        type: string
      - name: press_kit
        label: Press kit (PDF)
        type: file
        options:
          media: files
      - name: spotify
        label: Spotify artist link
        type: string
      - name: apple_music
        label: Apple Music link
        type: string
      - name: youtube_music
        label: YouTube Music link
        type: string
      - name: bandcamp
        label: Bandcamp page
        type: string
      - name: instagram
        label: Instagram
        type: string
      - name: facebook
        label: Facebook
        type: string
      - name: youtube
        label: YouTube channel
        type: string
      - name: tiktok
        label: TikTok
        type: string

  # ---- Added with the 21 templates. Each item only shows on the site if your template uses it. ----

  - name: collections
    label: Music collections (albums, EPs, sets)
    type: file
    path: content/collections.json
    format: json
    list: true
    fields:
      - name: label
        label: Short label
        type: string
        description: For example, Hymns and worship, or Live album
      - name: title
        label: Album or collection title
        type: string
        required: true
      - name: released
        label: Release date
        type: date
        options:
          format: yyyy-MM-dd
      - name: note
        label: A sentence about it
        type: text
      - name: cover
        label: Cover (square)
        type: image
        options:
          media: photos
      - name: bandcamp_link
        label: Bandcamp link
        type: string
      - name: songs
        label: Songs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Song title
            type: string
            required: true
          - name: length
            label: Length
            type: string
            description: For example, 3:42
          - name: scripture
            label: Scripture behind the song (optional)
            type: string
          - name: story
            label: Story behind the song (optional)
            type: text
          - name: audio
            label: Song preview file (MP3)
            type: file
            options:
              media: music
            description: Plays in the player on your site. Keep each file under 25 MB.
          - name: free_download
            label: Offer this song as a free download
            type: boolean
          - name: buy_link
            label: Bandcamp link to buy this song
            type: string

  - name: booking
    label: Booking options
    type: file
    path: content/booking.json
    format: json
    fields:
      - name: note
        label: A sentence above your booking options
        type: string
        description: For example, Share the date, the place and a little about your event.
      - name: options
        label: Booking options (up to two)
        type: object
        list:
          max: 2
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: type
            label: Who is this for?
            type: select
            options:
              values:
                - name: church
                  label: Churches
                - name: venue
                  label: Venues and events
                - name: other
                  label: Something else
          - name: label
            label: Name
            type: string
            required: true
            description: For example, For churches, or Weddings and private parties
          - name: title
            label: Heading (optional)
            type: string
          - name: blurb
            label: One or two sentences
            type: text
          - name: offers
            label: What you offer
            type: string
            list: true
            description: One per line, for example Sunday worship, Revivals
          - name: button
            label: Button text
            type: string
            description: For example, Book for your church
          - name: listen_label
            label: Listen button text (optional)
            type: string
            description: For example, Hear the hymns
          - name: photo
            label: Photo (optional)
            type: image
            options:
              media: photos
      - name: packages_note
        label: Note under your packages (optional)
        type: string

  - name: packages
    label: Packages
    type: file
    path: content/packages.json
    format: json
    list: true
    fields:
      - name: name
        label: Package name
        type: string
        required: true
      - name: description
        label: One sentence about it
        type: string
      - name: includes
        label: What's included
        type: string
        list: true

  - name: hosting
    label: Hosting a night (steps for churches)
    type: file
    path: content/hosting.json
    format: json
    fields:
      - name: heading
        label: Heading
        type: string
        description: For example, Host a worship night
      - name: steps
        label: Steps
        type: object
        list:
          max: 4
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Step
            type: string
            required: true
          - name: text
            label: One sentence
            type: string
      - name: needs_heading
        label: Heading for what you need (optional)
        type: string
        description: Leave empty for "What we'll ask of you"
      - name: needs
        label: What you need from the church
        type: string
        list: true
      - name: button
        label: Button text
        type: string
        description: For example, Ask about a date

  - name: press
    label: Press kit
    type: file
    path: content/press.json
    format: json
    fields:
      - name: quotes
        label: Quotes about you
        description: Shown on your website and on your press kit page (yoursite.com/epk).
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{source}"
        fields:
          - name: quote
            label: Quote
            type: text
            required: true
          - name: source
            label: Who said it
            type: string
      - name: fans_of
        label: For fans of (optional)
        type: string
        description: Two or three artists people compare you to
      - name: short_bio
        label: Short bio
        type: text
        description: Two or three sentences, written about you (Grace Miller is...). Bookers and writers copy this. Your full bio comes from your story.
      - name: genre
        label: Your style of music
        type: string
        description: For example, Americana and folk, or Modern worship
      - name: lineup_type
        label: How you perform, in a few words
        type: string
        description: For example, Solo or trio, or Five-piece band
      - name: is_group
        label: We're a band or group
        type: boolean
      - name: facts
        label: Quick facts
        description: Short numbers that tell your story, for example 10 / years leading worship. Three or four is plenty.
        type: object
        list:
          max: 6
          collapsible:
            collapsed: true
            summary: "{number} {label}"
        fields:
          - name: number
            label: Number or short fact
            type: string
            required: true
          - name: label
            label: What it means
            type: string
            required: true
      - name: highlights
        label: Highlights
        description: Big moments, newest first. For example, 2026 / Album released.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} {text}"
        fields:
          - name: year
            label: Year
            type: string
          - name: text
            label: What happened
            type: string
            required: true
      - name: lineup
        label: Lineup
        type: string
        description: Who plays, for example Solo with guitar, or a trio with piano and cello
      - name: set_length
        label: Set length
        type: string
        description: For example, 45 to 90 minutes, or a Sunday service
      - name: booking_note
        label: Anything else bookers should know (optional)
        type: text
        description: For example, We bring our own sound for up to 200 people.
      - name: booking_files
        label: Booking documents (optional)
        description: Stage plot, input list, rider or chord charts, as PDFs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Name
            type: string
            required: true
            description: For example, Stage plot (PDF)
          - name: file
            label: PDF
            type: file
            required: true
            options:
              media: files
      - name: press_photos
        label: Press photos
        description: Your best high-quality photos. Visitors can download them. Use the largest version you have.
        type: object
        list:
          max: 8
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: photo
            label: Photo
            type: image
            required: true
            options:
              media: photos
          - name: caption
            label: Caption
            type: string
          - name: credit
            label: Photographer (for the photo credit)
            type: string
      - name: coverage
        label: Articles and reviews about you (optional)
        description: Your podcasts and interviews are added automatically.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Headline
            type: string
            required: true
          - name: outlet
            label: Publication
            type: string
          - name: date
            label: Date
            type: date
            options:
              format: yyyy-MM-dd
          - name: link
            label: Link
            type: string
      - name: contacts
        label: Press kit contacts (optional)
        description: Leave empty to use your booking email from Contact and links. Add your agent, manager or publicist here if you have one.
        type: object
        list:
          max: 4
          collapsible:
            collapsed: true
            summary: "{role}"
        fields:
          - name: role
            label: Role
            type: string
            description: For example, Booking, Press or Management
          - name: name
            label: Name
            type: string
          - name: email
            label: Email
            type: string
          - name: phone
            label: Phone (optional)
            type: string
      - name: one_sheet
        label: One-sheet PDF (optional)
        type: file
        options:
          media: files
        description: If you have a one-page PDF about you.
      - name: photos_link
        label: Link to more press photos (optional)
        type: string

  - name: songlist
    label: Song list
    type: file
    path: content/songlist.json
    format: json
    fields:
      - name: groups
        label: Groups of songs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Group name
            type: string
            required: true
            description: For example, First dances, or Dance floor
          - name: songs
            label: Songs
            type: object
            list: true
            fields:
              - name: title
                label: Song
                type: string
                required: true
              - name: artist
                label: Artist or composer
                type: string
      - name: note
        label: A note under the list (optional)
        type: string

  - name: devotions
    label: Song devotions
    type: file
    path: content/devotions.json
    format: json
    list: true
    fields:
      - name: song
        label: Song
        type: string
      - name: reference
        label: Verse reference
        type: string
        description: For example, Psalm 46:10 · KJV
      - name: verse
        label: The verse
        type: text
        required: true
      - name: reflection
        label: A few sentences about it
        type: text

  - name: giving
    label: Giving
    type: file
    path: content/giving.json
    format: json
    fields:
      - name: heading
        label: Heading
        type: string
        description: For example, Partner with the ministry
      - name: text
        label: One or two sentences
        type: text
      - name: button
        label: Button text
        type: string
        description: For example, Give
      - name: link
        label: Link to your giving page
        type: string
      - name: fine_print
        label: Small print (optional)
        type: string
